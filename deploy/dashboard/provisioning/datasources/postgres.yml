apiVersion: 1

datasources:
  - name: Tlmtry
    uid: tlmtry-pg
    type: postgres
    access: proxy
    url: tlmtry-db:5432
    user: ${TLMTRY_PG_READONLY_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${TLMTRY_PG_DB}
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${TLMTRY_PG_READONLY_PASSWORD}
