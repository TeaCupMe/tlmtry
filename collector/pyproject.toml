[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlmtry-collector"
version = "1.0.0"
description = "RS-485 telemetry collector with SQLite/PostgreSQL storage and backup replication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "psycopg[binary]>=3.1"]

[project.scripts]
tlmtry-collector = "tlmtry_collector.__main__:main"
tlmtry-gui = "tlmtry_collector.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlmtry_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
