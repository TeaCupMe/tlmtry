# Example collector configuration
port: /dev/ttyUSB0
baudrate: 115200

# Primary database: SQLite file path (default) or PostgreSQL URL
database: /var/lib/tlmtry/primary.db
# database: postgresql://tlmtry:CHANGE_ME@127.0.0.1:5432/tlmtry

response_timeout_ms: 200
rediscover_every_s: 300
address_min: 1
address_max: 100
use_broadcast: true

# Optional per-address poll interval overrides (milliseconds)
# interval_overrides:
#   1: 1000
#   2: 5000

# Optional background replication target: SQLite file or PostgreSQL URL
# backup_path: /media/backup/tlmtry-backup.db
# backup_path: postgresql://tlmtry:CHANGE_ME@127.0.0.1:5432/tlmtry_backup
# replicate_every_s: 3600

log_level: INFO
